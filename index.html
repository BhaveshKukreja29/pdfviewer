<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=6, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Reader</title>
<style>
:root{--bg:#f2f2f2;--fg:#222;--btn:#222;--btnfg:#fff;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#ddd;--btn:#ddd;--btnfg:#111}}
:root[data-theme="dark"]{--bg:#111;--fg:#ddd;--btn:#ddd;--btnfg:#111}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
#start{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
button,label.b{background:var(--btn);color:var(--btnfg);border:0;border-radius:12px;padding:16px 28px;font-size:18px}
#pages{display:none}
.pg{width:100%;margin:0 0 4px;background:#fff}
.pg canvas{width:100%;height:auto;display:block}
#hot{position:fixed;top:0;left:0;width:48px;height:48px;z-index:5;display:none;-webkit-touch-callout:none;user-select:none}
small{opacity:.6}
#fs{position:fixed;left:50%;bottom:calc(32px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;display:none;opacity:.92}
</style>
</head>
<body>
<div id="start">
  <label class="b">Open PDF<input id="f" type="file" accept="application/pdf" hidden></label>
  <button id="cont" style="display:none">Continue last file</button>
  <small>Pinch to zoom. No buttons on screen while reading.<br>Long-press the top-left corner to open another file.</small>
</div>
<div id="hot"></div>
<button id="fs">Tap for fullscreen</button>
<div id="pages"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $=id=>document.getElementById(id);
let pdf=null, saveT;

function db(){return new Promise((res,rej)=>{const r=indexedDB.open("reader",1);r.onupgradeneeded=()=>r.result.createObjectStore("k");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function put(k,v){try{const d=await db();d.transaction("k","readwrite").objectStore("k").put(v,k)}catch(e){}}
async function get(k){try{const d=await db();return await new Promise(res=>{const q=d.transaction("k").objectStore("k").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}}

async function openBuf(buf,restore){
  try{
    pdf=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;
  }catch(e){alert("Couldn't open that PDF.");return}
  $("start").style.display="none";
  const box=$("pages");box.innerHTML="";box.style.display="block";$("hot").style.display="block";
  const first=await pdf.getPage(1),v1=first.getViewport({scale:1});
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){io.unobserve(e.target);render(e.target)}
  }),{rootMargin:"150% 0px"});
  for(let i=1;i<=pdf.numPages;i++){
    const d=document.createElement("div");d.className="pg";d.dataset.n=i;
    d.style.aspectRatio=v1.width+"/"+v1.height;
    box.appendChild(d);io.observe(d);
  }
  if(restore){const y=await get("y");if(y)requestAnimationFrame(()=>scrollTo(0,y*document.documentElement.scrollHeight))}
}
async function render(d){
  const p=await pdf.getPage(+d.dataset.n),v=p.getViewport({scale:1});
  const target=Math.min(2600,Math.max(1400,screen.width*(devicePixelRatio||1)*2));
  const vp=p.getViewport({scale:target/v.width});
  const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
  d.style.aspectRatio=v.width+"/"+v.height;
  await p.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
  d.appendChild(c);
}
$("f").onchange=async e=>{
  const file=e.target.files[0];if(!file)return;
  const buf=await file.arrayBuffer();
  put("file",buf);put("y",0);openBuf(buf,false);
};
$("cont").onclick=async()=>{const b=await get("file");if(b)openBuf(b,true)};
get("file").then(b=>{if(b)$("cont").style.display="block"});

function goFs(){const e=document.documentElement;try{(e.requestFullscreen||e.webkitRequestFullscreen).call(e,{navigationUI:"hide"})}catch(x){}}
function toggleFs(){if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else goFs()}
$("fs").onclick=()=>{goFs();$("fs").style.display="none"};
new MutationObserver(()=>{if($("pages").style.display==="block"&&!document.fullscreenElement)$("fs").style.display="block"}).observe($("pages"),{attributes:true});
let lt=0;document.addEventListener("touchend",e=>{if(e.touches.length||e.changedTouches.length>1)return;const n=Date.now();if(n-lt<300){toggleFs();$("fs").style.display="none"}lt=n},{passive:true});
addEventListener("scroll",()=>{
  clearTimeout(saveT);
  saveT=setTimeout(()=>put("y",scrollY/document.documentElement.scrollHeight),400);
},{passive:true});

let lp;
$("hot").addEventListener("touchstart",()=>{lp=setTimeout(()=>location.reload(),600)},{passive:true});
["touchend","touchmove","touchcancel"].forEach(t=>$("hot").addEventListener(t,()=>clearTimeout(lp),{passive:true}));
$("hot").addEventListener("contextmenu",e=>e.preventDefault());
</script>
</body>
</html>
